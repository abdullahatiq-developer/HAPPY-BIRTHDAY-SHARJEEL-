<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Sharjeel!</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#120826;--bg2:#2a0f4d;--gold:#ffd166;--pink:#ff5fa2;--purple:#9b5de5;--text:#fff4e6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
body.scroll{overflow-y:auto;overflow-x:hidden}
.script{font-family:'Pacifico',cursive}
.stage{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.stage.on{display:flex}
#stars,#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg) 70%)}#stars{z-index:-1}
#fx{contain:strict;position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}

/* ---------- Stage 1: gift ---------- */
#s1 h1{font-size:clamp(1.2rem,5vw,1.8rem);font-weight:300;margin-bottom:56px;z-index:2}
#s1 h1 b{color:var(--gold);font-weight:600}
.hint{margin-top:56px;font-size:.95rem;opacity:.75;animation:pulse 1.6s infinite;z-index:2}
@keyframes pulse{50%{opacity:.25}}
.gift{position:relative;width:180px;height:180px;cursor:pointer;z-index:2;animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}10%{transform:rotate(-5deg)}20%{transform:rotate(5deg)}30%{transform:rotate(-3deg)}40%{transform:rotate(0)}}
.gift .base{position:absolute;bottom:0;left:10px;right:10px;height:120px;background:linear-gradient(135deg,var(--pink),var(--purple));border-radius:8px;box-shadow:0 20px 50px rgba(255,95,162,.35)}
.gift .lid{position:absolute;top:32px;left:0;right:0;height:50px;background:linear-gradient(135deg,#ff7ab6,#b57bff);border-radius:8px;transition:transform .9s cubic-bezier(.3,1.6,.5,1),opacity .9s;z-index:2}
.gift .rib-v{position:absolute;left:50%;width:30px;margin-left:-15px;background:var(--gold);top:32px;bottom:0;z-index:3}
.gift .lid::after{content:"";position:absolute;left:50%;width:30px;margin-left:-15px;top:0;bottom:0;background:var(--gold)}
.gift .bow{position:absolute;top:-2px;left:50%;margin-left:-28px;width:56px;height:36px;z-index:4;transition:transform .9s cubic-bezier(.3,1.6,.5,1),opacity .9s}
.gift .bow::before,.gift .bow::after{content:"";position:absolute;top:0;width:28px;height:30px;border:6px solid var(--gold);border-radius:50% 50% 0 50%}
.gift .bow::before{left:0;transform:rotate(-20deg)}
.gift .bow::after{right:0;transform:scaleX(-1) rotate(-20deg)}
.gift .rib-v{height:auto}
.gift.open{animation:none}
.gift.open .rib-v{opacity:0;transition:opacity .3s}
.cake{position:absolute;left:15px;bottom:6px;width:150px;height:165px;opacity:0;transform:translateY(40px) scale(.2);z-index:5}
.gift.open .cake{animation:cakeUp 1.1s .5s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes cakeUp{to{opacity:1;transform:translateY(-40px) scale(1)}}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:10px;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.tier::before{content:"";position:absolute;top:0;left:0;right:0;height:12px;background:#fff4e6;border-radius:10px 10px 8px 8px}
.t1{bottom:0;width:150px;height:48px;background:linear-gradient(#ff7ab6,#e0457f)}
.t2{bottom:48px;width:112px;height:42px;background:linear-gradient(#b57bff,#7e44d6)}
.t3{bottom:90px;width:74px;height:34px;background:linear-gradient(#ffe29a,#ffc247)}
.candle{position:absolute;bottom:124px;width:6px;height:20px;background:repeating-linear-gradient(#fff 0 5px,var(--pink) 5px 10px);border-radius:2px}
.candle::after{content:"";position:absolute;left:-1px;top:-14px;width:8px;height:13px;background:radial-gradient(#fff,var(--gold) 50%,#ff8c00);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flame .3s infinite alternate}
@keyframes flame{to{transform:scale(1.15,.9) rotate(4deg)}}
.gift.open .lid,.gift.open .bow{transform:translateY(-130px) rotate(-25deg);opacity:0}
.gift.open .base{animation:flash 1s forwards}
@keyframes flash{to{opacity:0;transform:scale(1.4)}}
.rays{position:absolute;left:50%;top:50%;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(rgba(255,209,102,.35) 0 8deg,transparent 8deg 24deg);border-radius:50%;opacity:0;transform:scale(.1);pointer-events:none;-webkit-mask:radial-gradient(circle,#000 10%,transparent 65%);mask:radial-gradient(circle,#000 10%,transparent 65%)}
.gift.open .rays{animation:rays 1.4s ease-out forwards}
@keyframes rays{0%{opacity:0;transform:scale(.1) rotate(0)}30%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(60deg)}}

/* ---------- Stage 2: celebration ---------- */
#s2 .small{font-size:1.1rem;color:var(--gold);letter-spacing:.04em;margin-bottom:12px;z-index:2}
#s2 h2{font-size:clamp(2.2rem,10vw,4.5rem);line-height:1.2;z-index:2;text-shadow:0 0 18px rgba(255,95,162,.7);min-height:2.6em}
.cursor{display:inline-block;width:3px;background:var(--gold);margin-left:4px;animation:pulse .8s infinite}
.btn{margin-top:36px;padding:14px 34px;border:0;border-radius:40px;font:600 1rem 'Poppins',sans-serif;color:#2a0f4d;background:linear-gradient(90deg,var(--gold),#ffb347);cursor:pointer;box-shadow:0 8px 28px rgba(255,209,102,.4);z-index:6;opacity:0;pointer-events:none;transition:opacity 1s}
.btn.show{opacity:1;pointer-events:auto}
.balloon{will-change:transform;position:absolute;bottom:-140px;width:56px;height:70px;border-radius:50% 50% 48% 48%;animation:rise linear forwards}
.balloon::after{content:"";position:absolute;top:100%;left:50%;width:1px;height:60px;background:rgba(255,255,255,.5)}
@keyframes rise{to{transform:translateY(-120vh) translateX(var(--dx))}}
.conf{will-change:transform;position:absolute;top:-20px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg) translateX(var(--dx))}}
#music{position:fixed;top:14px;right:14px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:1.1rem;cursor:pointer}

/* ---------- Stage 3: memories ---------- */
#s3{position:relative;display:none;min-height:100%;z-index:2}
#s3.on{display:block;animation:fadein 1.4s}
@keyframes fadein{from{opacity:0}}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
.hero h2{font-size:clamp(2.4rem,11vw,5rem);color:var(--gold);text-shadow:0 0 30px rgba(255,209,102,.4)}
.hero .msg{max-width:560px;margin-top:24px;font-weight:300;line-height:1.8;font-size:1.05rem}
.hero .down{margin-top:36px;opacity:.6;animation:pulse 1.6s infinite}
section.wrap{max-width:980px;margin:0 auto;padding:60px 18px}
h3.title{font-size:2rem;text-align:center;margin-bottom:32px;color:var(--pink)}
.grid{columns:2;column-gap:12px}
@media(min-width:700px){.grid{columns:3;column-gap:16px}}
.ph{break-inside:avoid;margin-bottom:12px;border-radius:14px;overflow:hidden;cursor:zoom-in;opacity:0;transform:scale(.94);transition:opacity .7s,transform .7s;border:1px solid rgba(255,209,102,.25)}
.ph.in{opacity:1;transform:none}
.ph img{width:100%;display:block;min-height:140px;background:rgba(255,255,255,.05)}
.ph.empty{cursor:default;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:.8rem;opacity:.55;background:rgba(255,255,255,.05);border-style:dashed}
.wishes{display:grid;gap:14px}
@media(min-width:700px){.wishes{grid-template-columns:repeat(3,1fr)}}
.wish{padding:22px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);line-height:1.7;font-weight:300}
.wish b{display:block;color:var(--gold);margin-bottom:6px;font-weight:600}
footer{text-align:center;padding:50px 20px 70px;font-size:1.1rem}
#lb{position:fixed;inset:0;background:rgba(10,4,20,.94);display:none;align-items:center;justify-content:center;z-index:50}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:88vh;border-radius:10px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

/* ---------- Mobile / responsive polish ---------- */
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
.stage{padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));overflow:hidden}
#music{top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}
.hero{min-height:100vh;min-height:100svh}
footer{padding-bottom:max(70px,calc(env(safe-area-inset-bottom) + 40px));line-height:1.6}
#lb::after{content:"✕";position:fixed;top:max(14px,env(safe-area-inset-top));right:18px;font-size:1.6rem;opacity:.8}
.btn{min-height:48px}
@media(max-width:480px){
  #s1 h1{margin-bottom:44px;line-height:1.5}
  .hint{margin-top:44px}
  #s2 h2{font-size:clamp(2rem,10.5vw,3rem)}
  .hero .msg{font-size:1rem;line-height:1.7}
  section.wrap{padding:44px 14px}
  h3.title{font-size:1.7rem}
  .wish{padding:18px}
  .balloon{width:44px;height:56px}
}
@media(max-width:340px){.gift{scale:.85}}
@media(max-height:560px){            /* phones in landscape */
  #s1 h1{margin-bottom:24px;font-size:1.05rem}
  .hint{margin-top:20px}
  .gift{scale:.7}
  #s2 .small{margin-bottom:4px}
  #s2 h2{font-size:1.9rem;min-height:0}
  .btn{margin-top:16px}
}
@media(min-width:1000px){.gift{scale:1.25}#s1 h1{margin-bottom:80px}.hint{margin-top:80px}}
</style>
</head>
<body>
<div id="bg"></div><canvas id="stars"></canvas>
<canvas id="fw"></canvas>
<div id="fx"></div>
<button id="music" aria-label="Toggle music">♪</button>

<!-- Stage 1 -->
<div class="stage on" id="s1">
  <h1><b id="n1"></b>, there's a surprise for you 🎁</h1>
  <div class="gift" id="gift"><div class="rays"></div><div class="base"></div><div class="rib-v"></div><div class="lid"></div><div class="bow"></div>
    <div class="cake"><i class="tier t1"></i><i class="tier t2"></i><i class="tier t3"></i><i class="candle" style="left:52px"></i><i class="candle" style="left:72px"></i><i class="candle" style="left:92px"></i></div>
  </div>
  <p class="hint" id="hint">Tap the gift to open it</p>
</div>

<!-- Stage 2 -->
<div class="stage" id="s2">
  <p class="small">Today is a very special day</p>
  <h2 class="script"><span id="typed"></span><span class="cursor">&nbsp;</span></h2>
  <button class="btn" id="cont">Continue ✨</button>
</div>

<!-- Stage 3 -->
<div id="s3">
  <div class="hero">
    <p style="font-size:1.1rem;opacity:.8">Happy Birthday</p>
    <h2 class="script" id="n3"></h2>
    <p class="msg" id="msg"></p>
    <p class="down">Scroll down ↓</p>
  </div>
  <section class="wrap"><h3 class="title script">Our Memories</h3><div class="grid" id="grid"></div></section>
  <section class="wrap"><h3 class="title script">Wishes for You</h3><div class="wishes" id="wishes"></div></section>
  <footer>This website was made with love by your brother ❤️</footer>
</div>

<div id="lb"><img alt=""></div>

<script>
/* ============ EDIT HERE ============ */
const CONFIG = {
  name: "Sharjeel Zubairy",
  shortName: "Sharjeel",
  message: "Wishing you a year full of joy, success and endless laughter. You make our family brighter every single day. Enjoy your special day to the fullest!",
  // Add or remove picture paths. Put the files inside the assets folder.
  images: ["assets/pic1.jpg","assets/pic3.jpg","assets/pic2.jpg"],
  music: "assets/music.mp3",   // optional; leave "" to disable
  wishes: [
    ["Stay Happy","May every day bring you a reason to smile."],
    ["Dream Big","May all your goals turn into reality this year."],
    ["Stay Blessed","May you always be surrounded by love and good people."]
  ]
};
/* =================================== */

const $=id=>document.getElementById(id);
const COLORS=["#ffd166","#ff5fa2","#9b5de5","#4cc9f0","#fff4e6","#ff9f1c"];
const rnd=(a,b)=>Math.random()*(b-a)+a;
$("n1").textContent=CONFIG.shortName;
$("n3").textContent=CONFIG.name;
$("msg").textContent=CONFIG.message;

/* ----- twinkling stars background ----- */
const sc=$("stars"),sx=sc.getContext("2d");let stars=[];
function sizeCanvas(c){c.width=innerWidth;c.height=innerHeight}
function initStars(){sizeCanvas(sc);stars=Array.from({length:70},()=>({x:rnd(0,sc.width),y:rnd(0,sc.height),r:rnd(.5,1.8),p:rnd(0,6)}))}
function drawStars(){sx.clearRect(0,0,sc.width,sc.height);sx.fillStyle="#fff";stars.forEach(s=>{sx.globalAlpha=rnd(.3,.9);sx.beginPath();sx.arc(s.x,s.y,s.r,0,7);sx.fill()})}
initStars();drawStars();

/* ----- fireworks (lightweight) ----- */
const fc=$("fw"),fx=fc.getContext("2d"),SC=.6;let parts=[],fwOn=false,fwRun=false,fwT=null;
function sizeFw(){fc.width=innerWidth*SC;fc.height=innerHeight*SC}
function burst(x,y){const c=COLORS[Math.floor(rnd(0,COLORS.length))],n=32;
  for(let i=0;i<n;i++){const a=6.283*i/n,v=rnd(1,3.2);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c})}
  if(parts.length>300)parts.splice(0,parts.length-300)}
function loopFw(){
  fx.globalCompositeOperation="destination-out";fx.fillStyle="rgba(0,0,0,.22)";fx.fillRect(0,0,fc.width,fc.height);
  fx.globalCompositeOperation="source-over";
  parts=parts.filter(p=>p.life>.05);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.98;p.life*=.96;fx.globalAlpha=p.life;fx.fillStyle=p.c;fx.fillRect(p.x,p.y,3,3)});
  fx.globalAlpha=1;
  if(fwOn||parts.length)requestAnimationFrame(loopFw);else{fwRun=false;fx.clearRect(0,0,fc.width,fc.height)}}
function startFireworks(){sizeFw();fwOn=true;if(!fwRun){fwRun=true;loopFw()}
  fwT=setInterval(()=>{if(!fwOn)return clearInterval(fwT);if(!document.hidden)burst(rnd(.1,.9)*fc.width,rnd(.1,.55)*fc.height)},900);
  burst(fc.width/2,fc.height/3)}

/* ----- confetti & balloons (DOM, capped) ----- */
function confetti(n){const box=$("fx");
  for(let i=0;i<n&&box.childElementCount<60;i++){const e=document.createElement("i");e.className="conf";
    e.style.cssText=`left:${rnd(0,100)}%;background:${COLORS[i%COLORS.length]};--dx:${rnd(-60,60)}px;animation-duration:${rnd(4,8)}s`;
    box.appendChild(e);setTimeout(()=>e.remove(),8500)}}
function balloons(n){const box=$("fx");
  for(let i=0;i<n;i++)setTimeout(()=>{if(box.childElementCount>70)return;const e=document.createElement("div");e.className="balloon";
    e.style.cssText=`left:${rnd(2,92)}%;background:${COLORS[i%COLORS.length]};--dx:${rnd(-40,40)}px;animation-duration:${rnd(7,12)}s`;
    box.appendChild(e);setTimeout(()=>e.remove(),12500)},i*450)}

/* ----- music (optional, fails silently) ----- */
// Plays assets/music.mp3 if it exists; otherwise a built-in "Happy Birthday" music-box tune.
let audio=CONFIG.music?new Audio(CONFIG.music):null,musicOn=false,actx=null,stimer=null;
if(audio){audio.loop=true;audio.addEventListener("error",()=>audio=null)}
const mb=$("music");
const SONG=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
 [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
 [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],
 [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
function unlockCtx(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!actx)actx=new AC();if(actx.state==="suspended")actx.resume()}
function synthStart(){
  unlockCtx();if(!actx)return;const B=.5;clearTimeout(stimer);
  (function round(){
    if(!actx||!musicOn)return;let t=actx.currentTime+.1;
    SONG.forEach(([f,d])=>{
      [[f,"triangle",.28],[f*2,"sine",.08]].forEach(([fr,ty,v])=>{
        const o=actx.createOscillator(),g=actx.createGain();
        o.type=ty;o.frequency.value=fr;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);
        g.gain.exponentialRampToValueAtTime(.001,t+d*B*1.1);
        o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d*B*1.1)});
      t+=d*B});
    stimer=setTimeout(round,(t-actx.currentTime+1)*1000)})()}
function synthStop(){clearTimeout(stimer);if(actx){actx.close();actx=null}}
function musicStart(){
  musicOn=true;mb.textContent="❚❚";unlockCtx();   // unlock audio right inside the tap
  if(audio)audio.play().catch(()=>{audio=null;if(musicOn)synthStart()});else synthStart()}
function musicStop(){musicOn=false;mb.textContent="♪";if(audio)audio.pause();synthStop()}
mb.onclick=()=>musicOn?musicStop():musicStart();

/* ----- stage 1 -> 2 ----- */
let opened=false;
$("gift").onclick=()=>{
  if(opened)return;opened=true;$("gift").classList.add("open");$("hint").textContent="Make a wish... 🕯️";
  if(!musicOn)musicStart();
  setTimeout(()=>{$("s1").classList.remove("on");$("s2").classList.add("on");celebrate()},3600)};

function celebrate(){
  startFireworks();confetti(30);balloons(6);
  const t="Happy Birthday "+CONFIG.name+"! 🎂";let i=0;
  const type=setInterval(()=>{$("typed").textContent=t.slice(0,++i);if(i>=t.length)clearInterval(type)},90);
  const loop=setInterval(()=>{if(!$("s2").classList.contains("on"))return clearInterval(loop);confetti(10);balloons(2)},3500);
  setTimeout(()=>$("cont").classList.add("show"),8000)}

/* ----- stage 2 -> 3 ----- */
$("cont").onclick=()=>{
  fwOn=false;$("s2").classList.remove("on");$("s3").classList.add("on");
  document.body.classList.add("scroll");window.scrollTo(0,0);
  buildGallery();buildWishes();setInterval(()=>{if(!document.hidden)confetti(4)},4000)};

/* ----- gallery with graceful missing images + lightbox ----- */
function buildGallery(){
  const g=$("grid");
  CONFIG.images.forEach((src,i)=>{
    const d=document.createElement("div");d.className="ph";
    const im=new Image();im.alt="Memory with "+CONFIG.shortName;im.decoding="async";
    let backup=false;
    im.onerror=()=>{   // file missing -> try built-in backup copy, else show placeholder
      if(!backup&&typeof EMBED!=="undefined"&&EMBED[src]){backup=true;im.src=EMBED[src]}
      else{im.remove();d.classList.add("empty");d.textContent="Add "+src.split("/").pop()+" to the assets folder"}};
    d.onclick=()=>{if(!d.classList.contains("empty")){$("lb").querySelector("img").src=im.src;$("lb").classList.add("on")}};
    d.appendChild(im);im.src=src;g.appendChild(d);
    setTimeout(()=>d.classList.add("in"),150+i*200)})}
$("lb").onclick=()=>$("lb").classList.remove("on");
function buildWishes(){$("wishes").innerHTML=CONFIG.wishes.map(w=>`<div class="wish"><b>${w[0]}</b>${w[1]}</div>`).join("")}
let lastW=innerWidth;addEventListener("resize",()=>{if(innerWidth===lastW)return;lastW=innerWidth;initStars();drawStars();if(fwOn)sizeFw()});
</script>
